<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MealCart prototype</title>
  <meta name="description" content="Clickable prototype of MealCart: plan a week of meals to a calorie and protein target, approve it, and fill an Instacart cart you check out yourself.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="demo-bar" aria-label="Prototype controls">
    <div class="demo-bar-inner">
      <b>Prototype</b>
      <div class="demo-group" role="group" aria-label="Jump to a journey">
        <span>Journey</span>
        <button type="button" data-journey="J1" title="Set targets and plan">J1 Targets</button>
        <button type="button" data-journey="J2" title="Review, ask why, swap or untick">J2 Review</button>
        <button type="button" data-journey="J3" title="Approve the list">J3 Approve</button>
        <button type="button" data-journey="J4" title="Shop, with pauses">J4 Shop</button>
        <button type="button" data-journey="J5" title="Check the cart and hand off">J5 Cart</button>
      </div>
      <label class="demo-group">
        <span>Play as</span>
        <select id="persona">
          <option value="">Anyone</option>
          <option value="planner">Always-on-the-Go Planner</option>
          <option value="shopper">Budget-Savvy Shopper</option>
          <option value="dieter">On-and-Off Dieter</option>
        </select>
      </label>
      <label class="demo-group">
        <span>Failure</span>
        <select id="failure">
          <option value="">None</option>
          <option value="attention">Cart needs a look</option>
          <option value="quota">Every AI model busy</option>
          <option value="zip">Different delivery ZIP</option>
        </select>
      </label>
      <button type="button" class="theme" id="theme" aria-pressed="false">Dark</button>
    </div>
  </nav>

  <div class="shell">
    <header class="masthead">
      <span class="wordmark">MealCart</span>
      <ol class="stages" id="stages" aria-label="Progress">
        <li>Targets</li>
        <li>Plan</li>
        <li>Approve</li>
        <li>Cart</li>
      </ol>
    </header>
    <div class="layout">
      <main class="content" id="content"></main>
      <aside class="rail" id="rail"></aside>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="data/run.js"></script>
  <script src="app.js"></script>
</body>
</html>
